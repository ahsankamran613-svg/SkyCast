[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skycast"
version = "0.1.0"
description = "SkyCast (AgentWeather): Serverless Agentic Multi-Metric Weather & Air Quality Forecasting System for Lahore"
requires-python = ">=3.12,<3.14"
# Keep core dependencies lightweight for Vercel serverless (<500MB bundle limit).
# Heavy ML, Deep Learning, XAI, and Agentic packages live in [project.optional-dependencies.ml] and requirements-ml.txt.
dependencies = [
    "fastapi>=0.128.0,<1.0",
    "pydantic>=2.10.0,<3.0",
    "pydantic-settings>=2.15.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "supabase>=2.31.0,<3.0",
    "httpx>=0.28.1,<1.0",
]

[project.optional-dependencies]
ml = [
    "numpy>=2.0.2,<2.6",
    "pandas>=2.2.3,<3.0",
    "scipy>=1.13.0,<2.0",
    "statsmodels>=0.15.0,<0.16",
    "scikit-learn>=1.8.0,<2.0",
    "torch>=2.14.0,<2.16",
    "shap>=0.53.0,<0.55",
    "lime==0.2.0.1",
    "matplotlib>=3.9.0,<4.0",
    "scikit-image>=0.24.0,<1.0",
    "tqdm>=4.66.0,<5.0",
    "hopsworks[python]>=5.2.0,<5.3.0",
    "langgraph>=1.2.0,<2.0",
    "langchain-core>=1.4.7,<2.0",
    "groq>=1.7.0,<2.0",
    "google-genai>=3.0.0,<4.0",
]
dev = [
    "pytest>=9.0.0,<10.0",
    "pytest-httpx>=0.36.0,<1.0",
    "pytest-xdist>=3.6.0,<4.0",
]
all = ["skycast[ml,dev]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["skycast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -n auto --maxprocesses=3 --dist load --maxschedchunk=1"

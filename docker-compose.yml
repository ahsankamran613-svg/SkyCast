services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "${SKYCAST_API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      SKYCAST_ENV: ${SKYCAST_ENV:-development}
      SKYCAST_OFFLINE_MODE: ${SKYCAST_OFFLINE_MODE:-auto}
      SKYCAST_LOCAL_DATA_DIR: /app/.skycast_local
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
    volumes:
      - skycast_data:/app/.skycast_local
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "${SKYCAST_WEB_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - path: .env
        required: false
    environment:
      SKYCAST_ENV: ${SKYCAST_ENV:-development}
      SKYCAST_OFFLINE_MODE: ${SKYCAST_OFFLINE_MODE:-auto}
      SKYCAST_LOCAL_DATA_DIR: /app/.skycast_local
      SKYCAST_DOCKER_BACKFILL_DAYS: ${SKYCAST_DOCKER_BACKFILL_DAYS:-30}
      SKYCAST_SCHEDULER_INTERVAL_SECONDS: ${SKYCAST_SCHEDULER_INTERVAL_SECONDS:-3600}
      SKYCAST_TRAIN_INTERVAL_HOURS: ${SKYCAST_TRAIN_INTERVAL_HOURS:-24}
    volumes:
      - skycast_data:/app/.skycast_local
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  skycast_data:

name: SkyCast Hourly Ingestion & Agent Pipeline

on:
  # Triggered every hour at :02 UTC (:02 PKT; 01:02 UTC = 06:02 PKT runs the daily Weather Report Agent)
  # via Supabase pg_cron + pg_net (see supabase/migrations/002_pg_cron_github_dispatch.sql).
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: "Optional lookback window in hours (leave blank for Settings default)"
        required: false
        default: ""
        type: string
      skip_agents:
        description: "Skip invoking the 4-node LangGraph agent workflow"
        required: false
        default: false
        type: boolean
      offline:
        description: "Run in local SQLite offline mode (dry-run without cloud credentials)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  # Required so the Drift Agent can trigger training_pipeline.yml via workflow_dispatch
  actions: write

concurrency:
  group: skycast-hourly-pipeline
  cancel-in-progress: false

jobs:
  hourly_ingest:
    name: Hourly Ingest + LangGraph Agents (Lahore)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Run hourly ingestion and LangGraph agent pipeline
        env:
          SKYCAST_ENV: production
          SKYCAST_OFFLINE_MODE: ${{ inputs.offline == true && 'true' || 'false' }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST || 'c.app.hopsworks.ai' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_PRIMARY_MODEL: ${{ vars.GROQ_PRIMARY_MODEL || 'openai/gpt-oss-120b' }}
          GROQ_TERTIARY_MODEL: ${{ vars.GROQ_TERTIARY_MODEL || 'qwen-3.8-27b' }}
          GROQ_REASONING_EFFORT: low
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.5-flash-lite' }}
          LLM_TIMEOUT_SECONDS: ${{ vars.LLM_TIMEOUT_SECONDS || '15' }}
          GITHUB_TOKEN: ${{ secrets.SKYCAST_GITHUB_TOKEN || github.token }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TRAIN_WORKFLOW: training_pipeline.yml
          GITHUB_REF: ${{ github.ref_name }}
          INPUT_LOOKBACK_HOURS: ${{ inputs.lookback_hours }}
          INPUT_SKIP_AGENTS: ${{ inputs.skip_agents }}
          INPUT_OFFLINE: ${{ inputs.offline }}
        run: |
          set -euo pipefail
          args=()
          if [ -n "${INPUT_LOOKBACK_HOURS}" ]; then
            args+=(--lookback-hours "${INPUT_LOOKBACK_HOURS}")
          fi
          if [ "${INPUT_SKIP_AGENTS}" = "true" ]; then
            args+=(--skip-agents)
          fi
          if [ "${INPUT_OFFLINE}" = "true" ]; then
            args+=(--offline)
          fi
          python -m skycast.pipelines.hourly_ingest "${args[@]}"

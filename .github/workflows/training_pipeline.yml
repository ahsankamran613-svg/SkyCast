name: SkyCast Daily & Drift-Triggered Training Pipeline

on:
  schedule:
    # Runs daily at 01:15 UTC (06:15 PKT)
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: "Reason for training run (manual, scheduled, drift_detected)"
        required: false
        default: "manual"
        type: string
      run_id:
        description: "Originating hourly or drift run_id that triggered retraining"
        required: false
        default: ""
        type: string
      metrics:
        description: "Optional comma-separated target metrics (drift runs retrain all 8 series for leaderboard parity)"
        required: false
        default: ""
        type: string
      days:
        description: "Optional lookback history window in days (leave blank for full stored history)"
        required: false
        default: ""
        type: string
      offline:
        description: "Run in local SQLite offline mode (dry-run without cloud credentials)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: skycast-training-pipeline
  cancel-in-progress: false

jobs:
  train:
    name: EDA + 3-Family Training + SHAP/LIME + Champion Promotion
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-ml.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ml.txt

      - name: Record training trigger context
        env:
          TRIGGER_REASON: ${{ inputs.trigger_reason || github.event_name }}
          ORIGIN_RUN_ID: ${{ inputs.run_id }}
          TRIGGER_METRICS: ${{ inputs.metrics }}
          INPUT_DAYS: ${{ inputs.days }}
        run: |
          {
            echo "## SkyCast Training Run Context"
            echo "- **Event:** \`${GITHUB_EVENT_NAME}\`"
            echo "- **Trigger reason:** \`${TRIGGER_REASON}\`"
            if [ -n "${ORIGIN_RUN_ID}" ]; then
              echo "- **Origin run ID:** \`${ORIGIN_RUN_ID}\`"
            fi
            if [ -n "${TRIGGER_METRICS}" ]; then
              echo "- **Flagged metrics:** \`${TRIGGER_METRICS}\`"
            fi
            if [ -n "${INPUT_DAYS}" ]; then
              echo "- **Lookback days:** \`${INPUT_DAYS}\`"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Run ML training, EDA, SHAP/LIME, and champion promotion
        env:
          SKYCAST_ENV: production
          SKYCAST_OFFLINE_MODE: ${{ inputs.offline == true && 'true' || 'false' }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          HOPSWORKS_HOST: ${{ vars.HOPSWORKS_HOST || 'c.app.hopsworks.ai' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INPUT_TRIGGER_REASON: ${{ inputs.trigger_reason }}
          INPUT_METRICS: ${{ inputs.metrics }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_OFFLINE: ${{ inputs.offline }}
        run: |
          set -euo pipefail
          args=(--save-eda-json)
          if [ -n "${INPUT_DAYS}" ]; then
            args+=(--days "${INPUT_DAYS}")
          fi
          # On drift_detected dispatches, train all 8 metrics so latest_run_only leaderboard stays
          # complete while champion promotion still replaces only metrics that improve val_rmse.
          if [ "${INPUT_TRIGGER_REASON}" != "drift_detected" ] && [ -n "${INPUT_METRICS}" ]; then
            IFS=', ' read -r -a metric_list <<< "${INPUT_METRICS}"
            filtered_metrics=()
            for m in "${metric_list[@]}"; do
              if [ -n "${m}" ]; then
                filtered_metrics+=("${m}")
              fi
            done
            if [ "${#filtered_metrics[@]}" -gt 0 ]; then
              args+=(--metrics "${filtered_metrics[@]}")
            fi
          fi
          if [ "${INPUT_OFFLINE}" = "true" ]; then
            args+=(--offline)
          fi
          python -m skycast.pipelines.train "${args[@]}"

      - name: Upload EDA summary artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eda-summary-${{ github.run_id }}
          path: docs/eda_summary.json
          if-no-files-found: ignore
          retention-days: 14
